name: Post.ai Supabase Deploy

# Publica funções (Edge Functions) e aplica uma migration na produção, com o token SUPABASE_ACCESS_TOKEN.
# Rodar à mão: Actions → "Post.ai Supabase Deploy" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Funções a publicar (separadas por espaço; vazio = nenhuma)'
        default: 'mcp'
      migration:
        description: 'Arquivo de migration a aplicar (vazio = nenhuma), ex.: supabase/migrations/202610020001_diretor_melhorias.sql'
        default: ''

permissions:
  contents: read

concurrency:
  group: postai-supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: knmndlvoavxgzttjuncv

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Token configurado?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN no GitHub."; exit 1; fi
      - uses: actions/checkout@v4
      - name: Migration
        if: inputs.migration != ''
        env:
          FILE: ${{ inputs.migration }}
        run: |
          case "$FILE" in supabase/migrations/*.sql) ;; *) echo "::error::Só arquivos de supabase/migrations/"; exit 1;; esac
          test -f "$FILE"
          jq -Rs '{query: .}' < "$FILE" > body.json
          code=$(curl -s -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @body.json)
          cat out.json; echo
          [ "$code" -lt 300 ] || { echo "::error::Migration falhou (HTTP $code)"; exit 1; }
      - uses: supabase/setup-cli@v1
        if: inputs.functions != ''
        with:
          version: latest
      - name: Funções
        if: inputs.functions != ''
        env:
          FUNCS: ${{ inputs.functions }}
        run: |
          for f in $FUNCS; do
            test -d "supabase/functions/$f" || { echo "::error::Função $f não existe"; exit 1; }
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
          done
