name: Post.ai Render Worker

# Free render server: every 5 minutes, drains the `render_jobs` queue of the production Supabase with
# FFmpeg (join parts, camera moves, Manuscrito captions, light retouch, signature) and uploads the final.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postai-render-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.POSTAI_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.POSTAI_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Anything queued?
        id: queue
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secret POSTAI_SUPABASE_SERVICE_ROLE_KEY não configurado — nada a fazer."; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          count() { curl -sf "$SUPABASE_URL/rest/v1/$1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).length"; }
          stale=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          # fila de montagem + montagens travadas (servidor caiu no meio) + pedidos de exclusão de conta (LGPD)
          q=$(count "render_jobs?select=id&status=eq.queued")
          s=$(count "render_jobs?select=id&status=eq.rendering&updated_at=lt.$stale")
          stale30=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          p=$(count "privacy_requests?select=id&kind=eq.delete_account&or=(status.eq.requested,and(status.eq.processing,processed_at.lt.$stale30))")
          n=$((q + s + p))
          echo "na fila: $q · travadas: $s · exclusões LGPD: $p"; echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.queue.outputs.n != '0'
      - uses: actions/setup-node@v4
        if: steps.queue.outputs.n != '0'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: FFmpeg + fontes das legendas (OFL)
        if: steps.queue.outputs.n != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -fsSL -o "$RUNNER_TEMP/fonts/CaveatBrush-Regular.ttf" https://github.com/google/fonts/raw/main/ofl/caveatbrush/CaveatBrush-Regular.ttf
          curl -fsSL -o "$RUNNER_TEMP/fonts/Anton-Regular.ttf" https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf "$RUNNER_TEMP/fonts/"
      # legenda sincronizada com a fala: Whisper local (grátis, sem API); modelo e pacotes em cache entre execuções
      - uses: actions/setup-python@v5
        if: steps.queue.outputs.n != '0'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/worker/scripts/requirements.txt
      - uses: actions/cache@v4
        if: steps.queue.outputs.n != '0'
        with:
          path: |
            ~/.cache/huggingface
            ${{ runner.temp }}/postai-music
          key: postai-whisper-small-music-v1
      - if: steps.queue.outputs.n != '0'
        run: |
          pip install -q -r apps/worker/scripts/requirements.txt
          npm ci --workspace @postai/worker --workspace @postai/domain --ignore-scripts
      - name: Render queued jobs
        if: steps.queue.outputs.n != '0'
        env:
          FONT_FILE: ${{ runner.temp }}/fonts/CaveatBrush-Regular.ttf
          FONTS_DIR: ${{ runner.temp }}/fonts
          WHISPER_PYTHON: python
          WHISPER_MODEL: small
          MUSIC_CACHE: ${{ runner.temp }}/postai-music
        run: |
          for i in $(seq 1 10); do npx tsx apps/worker/src/main.ts --once; done

  # Gravar patrimônio: mirrors MMIX recording orders into the linked business profile and forwards queued takes.
  # The MMIX credential (MMIX_API_KEY = CP_KEY, or MMIX_ADMIN_TOKEN) exists only here (never in the app). Inactive until the secret and the variable are set.
  mmix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.POSTAI_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.POSTAI_SUPABASE_SERVICE_ROLE_KEY }}
      MMIX_ADMIN_TOKEN: ${{ secrets.MMIX_ADMIN_TOKEN }}
      MMIX_API_KEY: ${{ secrets.MMIX_API_KEY }}
      POSTAI_MMIX_WORKSPACE_ID: ${{ vars.POSTAI_MMIX_WORKSPACE_ID }}
    steps:
      - name: Configured?
        id: cfg
        run: |
          if { [ -z "$MMIX_ADMIN_TOKEN" ] && [ -z "$MMIX_API_KEY" ]; } || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Ponte MMIX não configurada — nada a fazer."; echo "on=0" >> "$GITHUB_OUTPUT"
          else echo "on=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.on == '1'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.on == '1'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.cfg.outputs.on == '1'
        run: npm ci --workspace @postai/worker --workspace @postai/domain --ignore-scripts
      - name: Sync orders + send takes
        if: steps.cfg.outputs.on == '1'
        run: npx tsx apps/worker/src/mmix-cli.ts

  melhorias:
    # Melhorias que o Claude registra pelo conector → issues do repositório (e o status volta para o app).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_URL: ${{ secrets.POSTAI_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.POSTAI_SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Configured?
        id: cfg
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "on=0" >> "$GITHUB_OUTPUT"; else echo "on=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.on == '1'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.on == '1'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.cfg.outputs.on == '1'
        run: npm ci --workspace @postai/worker --workspace @postai/domain --ignore-scripts
      - name: Sync melhorias ↔ issues
        if: steps.cfg.outputs.on == '1'
        run: npx tsx apps/worker/src/melhorias-cli.ts
