name: Post.ai Render Worker

# Free render server: every 5 minutes, drains the `render_jobs` queue of the production Supabase with
# FFmpeg (join parts, camera moves, Manuscrito captions, light retouch, signature) and uploads the final.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postai-render-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.POSTAI_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.POSTAI_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Anything queued?
        id: queue
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secret POSTAI_SUPABASE_SERVICE_ROLE_KEY não configurado — nada a fazer."; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(curl -sf "$SUPABASE_URL/rest/v1/render_jobs?select=id&status=eq.queued" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).length")
          echo "jobs na fila: $n"; echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.queue.outputs.n != '0'
      - uses: actions/setup-node@v4
        if: steps.queue.outputs.n != '0'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: FFmpeg + fonte manuscrita
        if: steps.queue.outputs.n != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/CaveatBrush-Regular.ttf" https://github.com/google/fonts/raw/main/ofl/caveatbrush/CaveatBrush-Regular.ttf
      - if: steps.queue.outputs.n != '0'
        run: npm ci --workspace @postai/worker --workspace @postai/domain --ignore-scripts
      - name: Render queued jobs
        if: steps.queue.outputs.n != '0'
        env:
          FONT_FILE: ${{ runner.temp }}/CaveatBrush-Regular.ttf
        run: |
          for i in $(seq 1 10); do npx tsx apps/worker/src/main.ts --once; done
