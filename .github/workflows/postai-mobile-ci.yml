name: Post.ai CI

on:
  pull_request:
    paths: ['apps/**', 'packages/**', 'supabase/**', 'package.json', 'package-lock.json', 'eslint.config.mjs', '.github/workflows/postai-*.yml']
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'supabase/**', 'package.json', 'package-lock.json', 'eslint.config.mjs', '.github/workflows/postai-*.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · unit/component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: FFmpeg (real render test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - run: npm ci
      - name: Expo dependency versions
        working-directory: apps/mobile
        run: npx expo install --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Android JS bundle (Metro + Babel)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/postai-export
      - name: API production bundle
        run: npm run build -w @postai/api
      - name: No secrets committed
        run: |
          if git grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{20,}|(SUPABASE_SERVICE_ROLE_KEY|OPENAI_API_KEY)=[^$ ]+' -- ':!*.md' ':!.github/workflows/*'; then
            echo "Possible secret committed"; exit 1
          fi

  database:
    name: migrations · RLS · auth integration (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: FFmpeg (render worker)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - name: Start Supabase (db, auth, rest, storage)
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,realtime,supavisor,postgres-meta
      - name: SQL RLS cross-tenant test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
      - run: npm ci
      - name: Auth + RLS + Storage integration (supabase-js, real GoTrue)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          (cd apps/api && npx vitest run test/rls.integration.test.ts --reporter verbose)
          (cd apps/worker && npx vitest run test/worker.integration.test.ts --reporter verbose)
      - name: Edge Function `generate` boots in Deno (auth + config guards)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          F="$API_URL/functions/v1/generate"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$F" -H "apikey: $ANON_KEY")" = "401"
          curl -sf -X POST "$API_URL/auth/v1/admin/users" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -d '{"email":"edge@test.local","password":"edge-pass-123","email_confirm":true}' >/dev/null
          T=$(curl -sf -X POST "$API_URL/auth/v1/token?grant_type=password" -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' -d '{"email":"edge@test.local","password":"edge-pass-123"}' | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).access_token")
          body='{"workspace_id":"11111111-1111-4111-8111-111111111111","content_item_id":null,"format":"thought","pillar_slug":"reflexao","event_text":null}'
          r=$(curl -s -X POST "$F" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d "$body")
          echo "$r"; echo "$r" | grep -q llm_not_configured
      - name: Edge bundle is up to date
        run: npm run build:edge -w @postai/api && git diff --exit-code supabase/functions
