name: Post.ai iOS (AltStore)

# iPhone sem conta paga da Apple: gera um .ipa SEM assinatura; o AltStore/SideStore do criador assina com a
# Apple ID gratuita dele e renova a cada 7 dias (os dados do app ficam). Repositório público = Mac grátis no GitHub.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar o .ipa como release postai-ios-<sha>"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: postai-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.POSTAI_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.POSTAI_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.POSTAI_API_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.POSTAI_SENTRY_DSN }}
      POSTAI_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Projeto iOS nativo (Expo prebuild + CocoaPods)
        working-directory: apps/mobile
        run: |
          npx expo prebuild -p ios --no-install --clean
          cd ios && pod install
      - name: Compilar sem assinatura
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "workspace=$WS scheme=$SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/*.app
      - name: Empacotar .ipa
        id: ipa
        run: |
          SHA="${GITHUB_SHA::7}"
          NAME="post-ai-ios-$SHA.ipa"
          mkdir -p Payload
          cp -R apps/mobile/ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry "$NAME" Payload
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: post-ai-ios
          path: ${{ steps.ipa.outputs.name }}
      - name: Release para o AltStore
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "postai-ios-${{ steps.ipa.outputs.sha }}" "${{ steps.ipa.outputs.name }}" --prerelease --target "$GITHUB_SHA" \
            --title "Post.ai iPhone ${{ steps.ipa.outputs.sha }}" \
            --notes "Instalar pelo AltStore ou SideStore (Apple ID gratuita, renova a cada 7 dias). Passo a passo: docs/IOS_ALTSTORE.md"
