name: Post.ai Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publicar como GitHub Release beta'
        type: boolean
        default: false
  pull_request:
    paths: ['apps/mobile/**', 'packages/domain/**', 'supabase/**', 'package-lock.json', '.github/workflows/postai-android-apk.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/domain/**', 'supabase/**', 'package-lock.json', '.github/workflows/postai-android-apk.yml']

permissions:
  contents: read

concurrency:
  group: postai-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

jobs:
  beta-apk:
    name: APK beta (arm64 + armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.POSTAI_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.POSTAI_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.POSTAI_API_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.POSTAI_SENTRY_DSN }}
      POSTAI_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - id: meta
        run: |
          v=$(node -p "require('./apps/mobile/package.json').version")
          echo "apk_name=post-ai-beta-v${v}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ]; then echo "mode=nuvem" >> "$GITHUB_OUTPUT"; else echo "mode=local" >> "$GITHUB_OUTPUT"; fi
      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install --clean
      - name: Build release APK (signed with debug key — sideload beta)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "${{ steps.meta.outputs.apk_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: post-ai-android-beta
          path: ${{ steps.meta.outputs.apk_name }}
          retention-days: 30
          if-no-files-found: error
      - run: |
          echo "### APK beta: ${{ steps.meta.outputs.apk_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Modo: ${{ steps.meta.outputs.mode }} (nuvem = secrets POSTAI_SUPABASE_* configurados)" >> "$GITHUB_STEP_SUMMARY"

  e2e-android:
    name: E2E Android (emulador) — fluxo crítico + offline + sync
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_EMAIL: rodrigo.e2e@test.local
      E2E_PASSWORD: e2e-${{ github.run_id }}-pw
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - name: Supabase env + E2E user
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          curl -sf -X POST "$API_URL/auth/v1/admin/users" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\",\"email_confirm\":true}" > /dev/null
      - run: npm ci
      - name: Build E2E APK (x86_64, points to host Supabase via 10.0.2.2)
        working-directory: apps/mobile
        env:
          POSTAI_E2E: '1'
        run: |
          export EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321 EXPO_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          npx expo prebuild -p android --no-install --clean
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run critical flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-results
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash apps/mobile/e2e/e2e-android.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-ai-e2e-results
          path: e2e-results
          retention-days: 14

  release:
    name: GitHub Release beta
    needs: [beta-apk, e2e-android]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: post-ai-android-beta
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="postai-beta-${GITHUB_SHA::7}"
          gh release create "$tag" ./*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Post.ai beta ${GITHUB_SHA::7}" \
            --notes "APK beta do Post.ai para instalação manual. Instruções em docs/HOMOLOGACAO.md."
