appId: me.rodrigoserra.postai
# Online: record the Thought of the Day part by part, then request the automatic final edit.
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- repeat:
    while:
      notVisible:
        id: tab-Hoje
    times: 4
    commands:
      - back
- tapOn:
    id: tab-Hoje
- scrollUntilVisible:
    element:
      id: open-thought
    timeout: 60000
- tapOn:
    id: open-thought
- extendedWaitUntil:
    visible:
      id: record-parts
    timeout: 20000
- tapOn:
    id: record-parts
- extendedWaitUntil:
    visible:
      id: teleprompter-text
    timeout: 30000
# part 1 shows only the first piece: the closing line must not be on the teleprompter yet
- assertNotVisible: "E se der certo!"
- takeScreenshot: 07c_parte1_teleprompter
- tapOn:
    id: open-settings
- tapOn:
    id: countdown-0
- tapOn:
    id: open-settings
- tapOn:
    id: record-button
- extendedWaitUntil:
    visible: "● REC ([3-9]|[1-9][0-9]+)s"
    timeout: 20000
- tapOn:
    id: record-button
- extendedWaitUntil:
    visible: "Parte 1 salva.*"
    timeout: 60000
- takeScreenshot: 08_parte1_salva
# CONCLUIR pode estar abaixo da dobra: rola antes de decidir se ainda há partes
- scrollUntilVisible:
    element:
      id: "next-part|attach-done"
    timeout: 60000
# as outras partes (mensagem, fechamento…): grava uma a uma até aparecer CONCLUIR
- repeat:
    while:
      notVisible:
        id: attach-done
    times: 6
    commands:
      - tapOn:
          id: next-part
      - extendedWaitUntil:
          visible:
            id: teleprompter-text
          timeout: 20000
      - tapOn:
          id: record-button
      - extendedWaitUntil:
          visible: "● REC ([3-9]|[1-9][0-9]+)s"
          timeout: 20000
      - tapOn:
          id: record-button
      - extendedWaitUntil:
          visible: "Parte [0-9]+ salva.*"
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: "next-part|attach-done"
          timeout: 60000
- scrollUntilVisible:
    element:
      id: attach-done
    timeout: 60000
- tapOn:
    id: attach-done
- extendedWaitUntil:
    visible:
      id: content-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: edit-plan
    timeout: 60000
- takeScreenshot: 09_plano_edicao
# deixa a linha de status/botões da montagem inteira na tela (fica logo acima deste texto)
- scrollUntilVisible:
    element:
      text: "Quer mudar algo.*"
    centerElement: true
    timeout: 60000
# the final is requested AUTOMATICALLY when all parts are in the cloud (the button stays as a fallback)
- repeat:
    while:
      notVisible: "Na fila de montagem….*|Montando o vídeo…|BAIXAR VÍDEO FINAL|VER VÍDEO FINAL / POSTAR"
    times: 20
    commands:
      - scrollUntilVisible:
          element:
            id: request-final
          optional: true
          timeout: 60000
      - tapOn:
          id: request-final
          optional: true
      - extendedWaitUntil:
          visible: "Na fila de montagem….*|Montando o vídeo…|BAIXAR VÍDEO FINAL|VER VÍDEO FINAL / POSTAR"
          timeout: 8000
          optional: true
# the server worker renders; the app downloads the final by itself when it's ready
- repeat:
    while:
      notVisible:
        id: open-final
    times: 70
    commands:
      - tapOn:
          text: "ATUALIZAR"
          optional: true
      - tapOn:
          id: download-final
          optional: true
      # o botão aparece no lugar de "Montando o vídeo…" (sem rolar: rolar para baixo passaria dele)
      - extendedWaitUntil:
          visible:
            id: open-final
          timeout: 8000
          optional: true
- extendedWaitUntil:
    visible:
      id: open-final
    timeout: 120000
- tapOn:
    id: open-final
- extendedWaitUntil:
    visible:
      id: final-screen
    timeout: 60000
- scrollUntilVisible:
    element:
      id: share-final
    timeout: 60000
- takeScreenshot: 10_video_final
