appId: me.rodrigoserra.postai
# Online: record the Thought of the Day part by part, then request the automatic final edit.
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- repeat:
    while:
      notVisible:
        id: tab-Hoje
    times: 4
    commands:
      - back
- tapOn:
    id: tab-Hoje
- scrollUntilVisible:
    element:
      id: open-thought
    timeout: 60000
- tapOn:
    id: open-thought
- scrollUntilVisible:
    element:
      id: record-parts
    timeout: 20000
- tapOn:
    id: record-parts
- extendedWaitUntil:
    visible:
      id: teleprompter-text
    timeout: 30000
# part 1 shows only the first piece: the closing line must not be on the teleprompter yet
- assertNotVisible: "E se der certo!"
- takeScreenshot: 07c_parte1_teleprompter
- tapOn:
    id: open-settings
- tapOn:
    id: countdown-0
- tapOn:
    id: open-settings
- tapOn:
    id: record-button
- extendedWaitUntil:
    visible: "● REC ([3-9]|[1-9][0-9]+)s"
    timeout: 20000
- tapOn:
    id: record-button
- extendedWaitUntil:
    visible: "Parte 1 salva.*"
    timeout: 60000
- takeScreenshot: 08_parte1_salva
# CONCLUIR pode estar abaixo da dobra: rola antes de decidir se ainda há partes
- scrollUntilVisible:
    element:
      id: "next-part|attach-done"
    timeout: 60000
# as outras partes (mensagem, fechamento…): grava uma a uma até aparecer CONCLUIR
- repeat:
    while:
      notVisible:
        id: attach-done
    times: 6
    commands:
      - tapOn:
          id: next-part
      - extendedWaitUntil:
          visible:
            id: teleprompter-text
          timeout: 20000
      - tapOn:
          id: record-button
      - extendedWaitUntil:
          visible: "● REC ([3-9]|[1-9][0-9]+)s"
          timeout: 20000
      - tapOn:
          id: record-button
      - extendedWaitUntil:
          visible: "Parte [0-9]+ salva.*"
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: "next-part|attach-done"
          timeout: 60000
- scrollUntilVisible:
    element:
      id: attach-done
    timeout: 60000
- tapOn:
    id: attach-done
# fim do fluxo numa tela só: o app já escolheu tudo, a pessoa só confirma
- extendedWaitUntil:
    visible:
      id: finalizar-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: final-summary
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*Música: .*"
    timeout: 30000
- tapOn:
    id: swap-music
- takeScreenshot: 09_resumo_montagem
- tapOn:
    id: confirm-render
- extendedWaitUntil:
    visible:
      id: render-progress
    timeout: 20000
- takeScreenshot: 09b_montando
# o servidor monta e a tela abre o vídeo final sozinha
- extendedWaitUntil:
    visible:
      id: final-screen
    timeout: 900000
# assistir → aprovar → publicar
- scrollUntilVisible:
    element:
      id: approve-final
    timeout: 60000
- tapOn:
    id: approve-final
- scrollUntilVisible:
    element:
      id: share-final
    timeout: 60000
- takeScreenshot: 10_video_final
