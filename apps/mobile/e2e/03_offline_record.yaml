appId: me.rodrigoserra.postai
# Runs with Wi-Fi and mobile data DISABLED (see e2e-android.sh).
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
# previous flow ends inside a pushed screen (no tab bar): go back to the tabs first
- repeat:
    while:
      notVisible:
        id: tab-Hoje
    times: 4
    commands:
      - back
- tapOn:
    id: tab-Hoje
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: open-main_video
    timeout: 60000
- tapOn:
    id: open-main_video
- scrollUntilVisible:
    element:
      id: open-teleprompter
    timeout: 20000
- tapOn:
    id: open-teleprompter
- extendedWaitUntil:
    visible:
      id: record-button
    timeout: 30000
- assertVisible:
    id: teleprompter
# ajustes do texto ficam no painel "Ajustes" (trilho lateral, estilo TikTok)
- tapOn:
    id: open-settings
- tapOn:
    id: font-plus
- tapOn:
    id: speed-plus
- tapOn:
    id: mirror
- tapOn:
    id: mirror
- tapOn:
    id: prompter-forward
- tapOn:
    id: prompter-back
- tapOn:
    id: countdown-3
- tapOn:
    id: open-settings
- takeScreenshot: 04_teleprompter
- tapOn:
    id: record-button
- extendedWaitUntil:
    visible:
      id: rec-indicator
    timeout: 20000
- tapOn:
    id: prompter-pause
- tapOn:
    id: prompter-pause
- extendedWaitUntil:
    visible: "● REC ([5-9]|[1-9][0-9]+)s"
    timeout: 20000
- tapOn:
    id: record-button
- extendedWaitUntil:
    visible:
      id: saved-local
    timeout: 60000
- takeScreenshot: 05_salvo_offline
- scrollUntilVisible:
    element:
      id: attach-done
    timeout: 60000
- tapOn:
    id: attach-done
# gravou tudo: o app vai direto para "Seu vídeo vai sair assim" (funciona offline; monta quando a internet voltar)
- extendedWaitUntil:
    visible:
      id: final-summary
    timeout: 20000
- takeScreenshot: 05b_resumo_offline
- back
- extendedWaitUntil:
    visible:
      id: content-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      text: 'Takes deste conteúdo .1.'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: complete-content
    timeout: 60000
- tapOn:
    id: complete-content
- extendedWaitUntil:
    visible:
      id: content-done
    timeout: 20000
