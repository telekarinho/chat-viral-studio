appId: me.rodrigoserra.postai
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
# scripts are generated automatically when Hoje opens
- scrollUntilVisible:
    element:
      id: open-main_video
    timeout: 60000
- tapOn:
    id: open-main_video
- extendedWaitUntil:
    visible:
      id: content-screen
    timeout: 60000
- scrollUntilVisible:
    element:
      id: hook-2
    timeout: 60000
- assertVisible:
    id: hook-0
- assertVisible:
    id: hook-1
- scrollUntilVisible:
    element:
      id: narrative-POR ISSO
    timeout: 60000
- assertVisible:
    id: narrative-E
- assertVisible:
    id: narrative-MAS
- scrollUntilVisible:
    element:
      text: ".*E se der certo!.*"
    timeout: 60000
- takeScreenshot: 02_roteiro
# legenda de postagem fica recolhida antes de gravar
- scrollUntilVisible:
    element:
      id: show-caption
    timeout: 60000
- tapOn:
    id: show-caption
- scrollUntilVisible:
    element:
      id: platform-tiktok
    timeout: 60000
- tapOn:
    id: platform-tiktok
- scrollUntilVisible:
    element:
      id: copy-caption
    timeout: 60000
- assertVisible:
    id: caption-text
    text: ".*RodrigoSerra.me.*"
- tapOn:
    id: copy-caption
- assertVisible: "LEGENDA COPIADA ✓"
- takeScreenshot: 03_legenda
- scrollUntilVisible:
    element:
      id: back-today
    timeout: 60000
- tapOn:
    id: back-today
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 20000
# second generation of the same pillar/format must not repeat the first one (memory / anti-repetition)
- scrollUntilVisible:
    element:
      id: open-thought
    timeout: 60000
- tapOn:
    id: open-thought
- extendedWaitUntil:
    visible:
      id: content-screen
    timeout: 60000
- assertVisible:
    id: hook-0
